name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DoubaoWatch
    runs-on: macos-14   # Xcode 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # 编译 iPhone App（不签名，跑在模拟器 destination）
      - name: Build iPhone App
        run: |
          xcodebuild build \
            -project DoubaoWatch.xcodeproj \
            -scheme DoubaoWatchApp \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty --color || true

      # 编译 Watch Extension（不签名，跑在 Watch 模拟器）
      - name: Build Watch Extension
        run: |
          xcodebuild build \
            -project DoubaoWatch.xcodeproj \
            -scheme "DoubaoWatch WatchKit Extension" \
            -destination "platform=watchOS Simulator,name=Apple Watch Series 9 (45mm)" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty --color || true

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | 15 / macOS 14 |" >> $GITHUB_STEP_SUMMARY
